name: WordPress Verify

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/staark-core/**'
      - 'themes/staark/**'
      - 'themes/staark-salong/**'
      - 'themes/staark-bygg/**'
      - '.github/workflows/wordpress-verify.yml'
      - '.github/workflows/wordpress-release.yml'

  pull_request:
    paths:
      - 'plugins/staark-core/**'
      - 'themes/staark/**'
      - 'themes/staark-salong/**'
      - 'themes/staark-bygg/**'
      - '.github/workflows/wordpress-verify.yml'
      - '.github/workflows/wordpress-release.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject merge conflict markers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            plugins themes .github scripts \
            --exclude-dir=node_modules \
            --exclude-dir=dist; then
            echo "Merge conflict markers found."
            exit 1
          fi

          echo "No merge conflict markers found."

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          php -v

          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file" >/dev/null
          done < <(
            find \
              plugins/staark-core \
              themes/staark \
              themes/staark-salong \
              themes/staark-bygg \
              -type f -name '*.php' -print0
          )

          echo "PHP syntax OK"

      - name: Validate JSON and package metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          themes = [
              Path("themes/staark"),
              Path("themes/staark-salong"),
              Path("themes/staark-bygg"),
          ]

          # Validate every theme JSON file.
          for theme in themes:
              for file in theme.rglob("*.json"):
                  json.loads(file.read_text(encoding="utf-8"))
                  print("JSON OK:", file)

          plugin = Path("plugins/staark-core/staark-core.php").read_text(
              encoding="utf-8"
          )

          version_match = re.search(
              r"^ \* Version:\s*(.+?)\s*$",
              plugin,
              re.MULTILINE,
          )
          assert version_match, "Staark Core Version header missing"

          core_version = version_match.group(1).strip()

          assert (
              f"const STAARK_HUB_VERSION = '{core_version}';" in plugin
          ), "STAARK_HUB_VERSION does not match plugin Version header"

          for file in (
              "includes/first-install.php",
              "admin/first-install-page.php",
          ):
              assert (
                  f"require_once STAARK_HUB_PLUGIN_DIR . '{file}';" in plugin
              ), f"Missing Core loader: {file}"

          def theme_header(path: str):
              content = Path(path).read_text(encoding="utf-8")

              version = re.search(
                  r"^Version:\s*(.+?)\s*$",
                  content,
                  re.MULTILINE,
              )
              assert version, f"Version missing in {path}"

              return content, version.group(1).strip()

          light, light_version = theme_header("themes/staark/style.css")
          salong, salong_version = theme_header(
              "themes/staark-salong/style.css"
          )
          bygg, bygg_version = theme_header(
              "themes/staark-bygg/style.css"
          )

          assert "Template: staark" in salong
          assert "Template: staark" in bygg

          assert Path("themes/staark/theme.json").exists()
          assert Path("themes/staark/templates").is_dir()

          assert Path(
              "themes/staark-salong/presets/salong.json"
          ).exists()

          assert Path(
              "themes/staark-bygg/presets/bygg.json"
          ).exists()

          print("Core:", core_version)
          print("Light:", light_version)
          print("Salong:", salong_version)
          print("Bygg:", bygg_version)
          print("JSON, versions and package metadata OK")
          PY

      - name: Build release packages smoke test
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p dist/package/staark-core
          mkdir -p dist/package/staark
          mkdir -p dist/package/staark-salong
          mkdir -p dist/package/staark-bygg

          cp -a plugins/staark-core/. dist/package/staark-core/
          cp -a themes/staark/. dist/package/staark/
          cp -a themes/staark-salong/. dist/package/staark-salong/
          cp -a themes/staark-bygg/. dist/package/staark-bygg/

          (
            cd dist/package

            zip -qr9 ../staark-core.zip staark-core
            zip -qr9 ../staark-theme.zip staark
            zip -qr9 ../staark-salong-theme.zip staark-salong
            zip -qr9 ../staark-bygg-theme.zip staark-bygg
          )

          unzip -tq dist/staark-core.zip
          unzip -tq dist/staark-theme.zip
          unzip -tq dist/staark-salong-theme.zip
          unzip -tq dist/staark-bygg-theme.zip

          unzip -l dist/staark-core.zip \
            | grep -q 'staark-core/staark-core.php'

          unzip -l dist/staark-theme.zip \
            | grep -q 'staark/style.css'

          unzip -l dist/staark-salong-theme.zip \
            | grep -q 'staark-salong/style.css'

          unzip -l dist/staark-bygg-theme.zip \
            | grep -q 'staark-bygg/style.css'

          echo "All WordPress release packages build successfully."
